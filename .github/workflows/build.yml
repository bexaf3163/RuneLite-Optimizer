name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned capture tool
        shell: powershell
        run: ./tools/prepare.ps1
      - name: Build and self-test
        shell: powershell
        run: ./test.ps1
      - name: Package
        shell: powershell
        run: |
          Get-FileHash dist/RuneLite-Optimizer.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  RuneLite-Optimizer.exe" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RuneLite-Optimizer-portable
          path: |
            dist/RuneLite-Optimizer.exe
            SHA256SUMS.txt
  release:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RuneLite-Optimizer-portable
      - name: Publish portable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '\r\n' < VERSION)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping the published artifact unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/RuneLite-Optimizer.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file RELEASE-NOTES.md --title "RuneLite Optimizer $TAG"
